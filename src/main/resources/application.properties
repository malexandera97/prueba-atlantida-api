spring.application.name=prueba-atlantida-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prueba_atlantida}
spring.datasource.username=${DB_USER:banco}
spring.datasource.password=${DB_PASSWORD:banco}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
